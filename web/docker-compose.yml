services:
  lan-control-plane-web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: lan-control-plane-web
    restart: unless-stopped
    env_file:
      - ./.env.production
    working_dir: /app
    command: npm run start
    networks:
      - public-net
      - rp-admin
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

networks:
  public-net:
    external: true
  rp-admin:
    external: true
