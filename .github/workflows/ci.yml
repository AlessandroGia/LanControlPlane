name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  quality-and-tests:
    name: Quality and tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project:
          - shared
          - server
          - agent

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Run tests
        run: uv run pytest -q

  alembic:
    name: Alembic migration check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Prepare server env file
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=sqlite:///./data/lan_control_plane.db
          ACCESS_TOKEN_EXPIRE_MINUTES=60
          AGENT_ENROLLMENT_TOKEN=ci-agent-enrollment-secret-long-enough
          WOL_HELPER_TOKEN=ci-wol-helper-secret
          EOF

      - name: Prepare local sqlite path
        run: mkdir -p data

      - name: Run Alembic upgrade
        run: uv run alembic -c alembic.ini upgrade head

      - name: Check model and migration consistency
        run: uv run alembic -c alembic.ini check

  web-quality:
    name: Web quality and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build server image
        run: docker build -f server/Dockerfile -t lan-control-plane-server .

      - name: Build agent image
        run: docker build -f agent/Dockerfile -t lan-control-plane-agent .

      - name: Build web image
        run: docker build -f web/Dockerfile -t lan-control-plane-web .
