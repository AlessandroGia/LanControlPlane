services:
  lan-control-plane-server:
    image: lan-control-plane-server:local
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: lan-control-plane-server
    restart: unless-stopped
    env_file:
      - ./.env
    working_dir: /app/server
    volumes:
      - ./data:/app/server/data
#    ports:
#      - "8765:8000"
    networks:
      - rp-admin
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

  migrate:
    image: lan-control-plane-server:local
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: lan-control-plane-migrate
    env_file:
      - ./.env
    working_dir: /app/server
    volumes:
      - ./data:/app/server/data
      - ./alembic:/app/server/alembic
      - ./alembic.ini:/app/server/alembic.ini:ro
    entrypoint: []
    command:
      - /app/server/.venv/bin/alembic
      - upgrade
      - head
    networks:
      - rp-admin
    profiles:
      - tools
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

  create-admin:
    image: lan-control-plane-server:local
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: lan-control-plane-create-admin
    env_file:
      - ./.env
    working_dir: /app/server
    volumes:
      - ./data:/app/server/data
      - ./scripts:/app/server/scripts
    command:
      - /app/server/.venv/bin/python
      - /app/server/scripts/create_admin.py
    networks:
      - rp-admin
    profiles:
      - tools
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

  makemigrations:
    image: lan-control-plane-server:local
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: lan-control-plane-makemigrations
    env_file:
      - ./.env
    working_dir: /app/server
    volumes:
      - ./data:/app/server/data
      - ./src:/app/server/src
      - ../shared/src:/app/shared/src
      - ./alembic:/app/server/alembic
      - ./alembic.ini:/app/server/alembic.ini:ro
    command:
      - /app/server/.venv/bin/alembic
      - revision
      - --autogenerate
      - -m
      - update schema
    networks:
      - rp-admin
    profiles:
      - tools
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

networks:
  rp-admin:
    external: true
